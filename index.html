<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>全域情报与量化决策看板 · 511</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #0b0f17; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(17, 24, 39, 0.86); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .md-body h1, .md-body h2 { font-size: 1.05rem; font-weight: 700; color: #f8fafc; margin-top: 0.75rem; margin-bottom: 0.4rem; }
    .md-body h3, .md-body h4 { font-size: 0.92rem; font-weight: 600; color: #93c5fd; margin-top: 0.65rem; margin-bottom: 0.3rem; }
    .md-body p, .md-body li { font-size: 0.85rem; line-height: 1.55; color: #cbd5e1; }
    .md-body ul { list-style: disc; padding-left: 1.2rem; margin: 0.35rem 0; }
    .md-body blockquote { border-left: 3px solid #3b82f6; padding: 0.4rem 0.7rem; background: rgba(59,130,246,0.1); border-radius: 0.375rem; margin: 0.5rem 0; }
    .md-body table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 0.5rem 0; display: block; overflow-x: auto; }
    .md-body th, .md-body td { border: 1px solid rgba(255,255,255,0.1); padding: 0.35rem 0.5rem; text-align: left; white-space: nowrap; }
    .md-body th { background: rgba(255,255,255,0.05); color: #94a3b8; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="pb-24 min-h-screen">
  <!-- Sticky Mobile Header -->
  <header class="sticky top-0 z-30 glass px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" id="live-dot"></span>
          <h1 class="text-base font-bold tracking-tight text-white">全域情报与量化决策台</h1>
        </div>
        <p class="text-[11px] text-slate-400 mt-0.5" id="status-bar">正在同步 ntfy.sh/trendradar-mac-511 ...</p>
      </div>
      <button onclick="loadData()" class="px-3 py-1.5 rounded-lg bg-blue-600/20 border border-blue-500/30 text-blue-300 text-xs font-medium active:scale-95 transition">
        刷新数据
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-3 pt-3 space-y-3">
    <!-- Quick Summary Strip -->
    <div id="kpi-strip" class="grid grid-cols-3 gap-2">
      <div class="glass rounded-xl p-2.5">
        <div class="text-[11px] text-slate-400">监控标的</div>
        <div class="text-base font-bold text-white mt-0.5" id="kpi-stocks">--</div>
      </div>
      <div class="glass rounded-xl p-2.5">
        <div class="text-[11px] text-slate-400">大盘信号</div>
        <div class="text-base font-bold text-amber-400 mt-0.5" id="kpi-market">--</div>
      </div>
      <div class="glass rounded-xl p-2.5">
        <div class="text-[11px] text-slate-400">五大领域情报</div>
        <div class="text-base font-bold text-emerald-400 mt-0.5" id="kpi-radar">--</div>
      </div>
    </div>

    <!-- Search & Filter -->
    <div id="stock-filter-bar" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>

    <!-- Main Content Container -->
    <div id="view-stocks" class="space-y-2.5"></div>
    <div id="view-radar" class="space-y-2.5 hidden"></div>
    <div id="view-market" class="space-y-2.5 hidden"></div>
  </main>

  <!-- Bottom Tab Navigation (Mobile App Style) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 glass border-t border-slate-800/80 px-2 py-1.5">
    <div class="max-w-md mx-auto grid grid-cols-3 gap-1">
      <button onclick="switchTab('stocks')" id="tab-stocks" class="py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white">
        11只标的与预判
      </button>
      <button onclick="switchTab('radar')" id="tab-radar" class="py-1.5 rounded-lg text-xs font-medium text-slate-400">
        五大领域情报
      </button>
      <button onclick="switchTab('market')" id="tab-market" class="py-1.5 rounded-lg text-xs font-medium text-slate-400">
        A股大盘复盘
      </button>
    </div>
  </nav>

  <script>
    const TOPIC = "trendradar-mac-511";
    let parsedStocks = [];
    let currentStockFilter = "ALL";

    function switchTab(tab) {
      ["stocks", "radar", "market"].forEach(t => {
        document.getElementById("view-" + t).classList.toggle("hidden", t !== tab);
        const btn = document.getElementById("tab-" + t);
        if (t === tab) {
          btn.className = "py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white";
        } else {
          btn.className = "py-1.5 rounded-lg text-xs font-medium text-slate-400";
        }
      });
      document.getElementById("stock-filter-bar").classList.toggle("hidden", tab !== "stocks");
    }

    function badgeColor(score) {
      const s = parseInt(score || "50", 10);
      if (s >= 60) return "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";
      if (s >= 48) return "bg-amber-500/20 text-amber-300 border-amber-500/30";
      return "bg-rose-500/20 text-rose-300 border-rose-500/30";
    }

    function renderStocks() {
      const container = document.getElementById("view-stocks");
      const filterBar = document.getElementById("stock-filter-bar");
      if (!parsedStocks.length) {
        container.innerHTML = `<div class="glass rounded-xl p-6 text-center text-sm text-slate-400">暂未读取到股票分析数据</div>`;
        return;
      }

      // Filter pills
      let pillsHtml = `<button onclick="setStockFilter('ALL')" class="px-3 py-1 rounded-full text-xs whitespace-nowrap border ${currentStockFilter === 'ALL' ? 'bg-blue-600 text-white border-blue-500' : 'glass text-slate-300 border-slate-700'}">全部 (${parsedStocks.length})</button>`;
      parsedStocks.forEach(s => {
        const active = currentStockFilter === s.code;
        pillsHtml += `<button onclick="setStockFilter('${s.code}')" class="px-3 py-1 rounded-full text-xs whitespace-nowrap border ${active ? 'bg-blue-600 text-white border-blue-500' : 'glass text-slate-300 border-slate-700'}">${s.name} · ${s.score}</button>`;
      });
      filterBar.innerHTML = pillsHtml;

      const list = currentStockFilter === "ALL" ? parsedStocks : parsedStocks.filter(s => s.code === currentStockFilter);
      container.innerHTML = list.map((s, idx) => `
        <div class="glass rounded-xl p-3.5 space-y-2.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base font-bold text-white">${s.name}</span>
                <span class="text-xs font-mono text-slate-400">${s.code}</span>
              </div>
              <p class="text-xs text-slate-300 mt-1 leading-relaxed">${s.oneSentence || s.advice}</p>
            </div>
            <div class="text-right shrink-0">
              <span class="inline-block px-2 py-0.5 rounded-md text-xs font-bold border ${badgeColor(s.score)}">
                ${s.score}分 · ${s.advice}
              </span>
              <div class="text-xs text-slate-400 mt-1">${s.trend} ${s.price ? "· " + s.price : ""}</div>
            </div>
          </div>

          ${(s.weekForecast || s.monthForecast) ? `
          <div class="rounded-lg bg-blue-950/40 border border-blue-500/20 p-2.5 space-y-1.5 text-xs">
            <div class="font-semibold text-blue-300">未来 1 周 / 1 个月走势前瞻预判</div>
            ${s.weekForecast ? `<div class="text-slate-200"><span class="text-blue-400 font-medium">未来1周：</span>${s.weekForecast}</div>` : ""}
            ${s.monthForecast ? `<div class="text-slate-200"><span class="text-indigo-400 font-medium">未来1月：</span>${s.monthForecast}</div>` : ""}
          </div>` : ""}

          ${(s.idealBuy || s.stopLoss || s.takeProfit) ? `
          <div class="grid grid-cols-3 gap-1.5 text-[11px]">
            <div class="rounded bg-slate-800/70 p-2">
              <div class="text-slate-400">理想买点</div>
              <div class="text-emerald-300 font-medium mt-0.5 truncate" title="${s.idealBuy}">${s.idealBuy || "--"}</div>
            </div>
            <div class="rounded bg-slate-800/70 p-2">
              <div class="text-slate-400">严格止损</div>
              <div class="text-rose-300 font-medium mt-0.5 truncate" title="${s.stopLoss}">${s.stopLoss || "--"}</div>
            </div>
            <div class="rounded bg-slate-800/70 p-2">
              <div class="text-slate-400">目标止盈</div>
              <div class="text-amber-300 font-medium mt-0.5 truncate" title="${s.takeProfit}">${s.takeProfit || "--"}</div>
            </div>
          </div>` : ""}

          <details class="group pt-1 border-t border-slate-800">
            <summary class="text-xs text-blue-400 cursor-pointer select-none flex items-center justify-between">
              <span>展开完整行情、均线、空仓/持仓建议与检查清单</span>
              <span class="group-open:rotate-180 transition">▼</span>
            </summary>
            <div class="md-body pt-2">${marked.parse(s.rawMarkdown)}</div>
          </details>
        </div>
      `).join("");
    }

    function setStockFilter(code) {
      currentStockFilter = code;
      renderStocks();
    }

    async function loadData() {
      const statusEl = document.getElementById("status-bar");
      statusEl.textContent = "正在拉取 ntfy.sh/" + TOPIC + " 最新数据...";
      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1`);
        const text = await res.text();
        const lines = text.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(x => x.event === "message");

        // 1. Reassemble Stock Dashboard chunks
        const stockChunks = lines.filter(x => (x.title || "").includes("股票分析报告") && !(x.message || "").includes("# 📈 大盘复盘") && !(x.message || "").includes("五、消息催化"));
        // Sort by batch index if present
        stockChunks.sort((a, b) => {
          const ma = (a.title || "").match(/\((\d+)\/(\d+)\)/);
          const mb = (b.title || "").match(/\((\d+)\/(\d+)\)/);
          if (ma && mb && ma[2] === mb[2]) return parseInt(ma[1]) - parseInt(mb[1]);
          return a.time - b.time;
        });
        const fullStockMd = stockChunks.map(x => x.message).join("\n");

        // Extract summary scores
        const scoreMap = {};
        const summaryRegex = /\*\*([^*]+?)\(([^)]+)\)\*\*:\s*([^|]+)\|\s*评分\s*(\d+)\s*\|\s*([^\n]+)/g;
        let sm;
        while ((sm = summaryRegex.exec(fullStockMd)) !== null) {
          scoreMap[sm[2].trim()] = {
            name: sm[1].trim(),
            code: sm[2].trim(),
            advice: sm[3].trim(),
            score: sm[4].trim(),
            trend: sm[5].trim()
          };
        }

        // Split by stock sections (`## `)
        const sections = fullStockMd.split(/\n(?=##\s+[🟢🟡🔴⚪])/);
        parsedStocks = [];
        sections.forEach(sec => {
          const hm = sec.match(/^##\s+[🟢🟡🔴⚪]\s+(.+?)\s*\(([^)]+)\)/);
          if (!hm) return;
          const name = hm[1].trim();
          const code = hm[2].trim();
          const meta = scoreMap[code] || { name, code, advice: "观望", score: "50", trend: "震荡" };
          const oneM = sec.match(/\*\*一句话决策\*\*:\s*([^\n]+)/);
          const wkM = sec.match(/\*\*📅 未来 1 周推演\*\*：([^\n]+)/);
          const moM = sec.match(/\*\*📆 未来 1 个月中线预判\*\*：([^\n]+)/);
          const buyM = sec.match(/\|\s*🎯 理想买入点\s*\|\s*([^|]+)\|/);
          const stopM = sec.match(/\|\s*🛑 止损位\s*\|\s*([^|]+)\|/);
          const tpM = sec.match(/\|\s*🎊 目标位\s*\|\s*([^|]+)\|/);
          const priceM = sec.match(/\|\s*当前价\s*\|\s*([0-9.]+)\s*\|/);

          parsedStocks.push({
            ...meta,
            oneSentence: oneM ? oneM[1].trim() : "",
            weekForecast: wkM ? wkM[1].trim() : "",
            monthForecast: moM ? moM[1].trim() : "",
            idealBuy: buyM ? buyM[1].trim() : "",
            stopLoss: stopM ? stopM[1].trim() : "",
            takeProfit: tpM ? tpM[1].trim() : "",
            price: priceM ? priceM[1].trim() : "",
            rawMarkdown: sec
          });
        });

        document.getElementById("kpi-stocks").textContent = parsedStocks.length + " 只已就绪";
        renderStocks();

        // 2. Reassemble Market Review
        const marketChunks = lines.filter(x => (x.message || "").includes("大盘复盘") || (x.message || "").includes("六、明日交易计划"));
        const fullMarketMd = marketChunks.map(x => x.message).join("\n");
        const sigM = fullMarketMd.match(/盘面信号\*\*：([^\n]+)/);
        document.getElementById("kpi-market").textContent = sigM ? sigM[1].trim() : "43/100 防守";
        document.getElementById("view-market").innerHTML = `<div class="glass rounded-xl p-4 md-body">${marked.parse(fullMarketMd || "暂无大盘复盘数据")}</div>`;

        // 3. Latest TrendRadar 5-domain AI report
        const radarMsgs = lines.filter(x => (x.message || "").includes("AI 热点分析"));
        const latestRadar = radarMsgs.length ? radarMsgs[radarMsgs.length - 1] : null;
        if (latestRadar) {
          document.getElementById("kpi-radar").textContent = "5大领域已更新";
          const formattedRadar = latestRadar.message
            .replace(/\*\*核心热点态势\*\*/g, "## 🤖 科技与 AI 最新成果")
            .replace(/\*\*舆论风向争议\*\*/g, "## 💰 货币、宏观与金融期货")
            .replace(/\*\*异动与弱信号\*\*/g, "## 🎮 游戏圈与 App Store / Play Store 动态")
            .replace(/\*\*RSS 深度洞察\*\*/g, "## 🌍 国际政治与外媒视野")
            .replace(/\*\*研判策略建议\*\*/g, "## 🔥 大众舆情热点与选题灵感");
          document.getElementById("view-radar").innerHTML = `<div class="glass rounded-xl p-4 md-body">${marked.parse(formattedRadar)}</div>`;
        }

        const lastTime = lines.length ? new Date(lines[lines.length - 1].time * 1000).toLocaleString("zh-CN") : "--";
        statusEl.textContent = `已实时同步 ntfy.sh/${TOPIC} · 最新消息: ${lastTime}`;
      } catch (err) {
        statusEl.textContent = "同步失败: " + err.message;
      }
    }

    loadData();
  </script>
</body>
</html>
