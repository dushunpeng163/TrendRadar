      --bg-3: #272727;
      --bg-4: #313131;
      --ink-1: #F5F5F5;
      --ink-2: #9B9B9B;
      --ink-3: #666666;
      --line: rgba(255, 255, 255, 0.08);

    * { -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg-0);
      color: var(--ink-1);
      font-variant-numeric: tabular-nums;
      overflow-x: hidden;
    }

      background-color: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .inner-box {
      background-color: var(--bg-2);
      border-radius: 8px;
    }

    .ease-out-expo {
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tap-scale:active {
      transform: scale(0.985);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      line-height: 24px;
      font-weight: 600;
      color: var(--ink-1);

    .sheet-prose h3, .sheet-prose h4 {
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: var(--ink-1);
      margin-top: 16px;
      margin-bottom: 6px;
    }
    .sheet-prose p, .sheet-prose li {
      font-size: 14px;
      line-height: 22px;
      color: var(--ink-2);
    }
    .sheet-prose strong { color: var(--ink-1); font-weight: 600; }
    .sheet-prose ul { list-style: disc; padding-left: 18px; margin: 6px 0; }
    .sheet-prose blockquote {
      background-color: var(--bg-2);
      border-left: 3px solid var(--ink-1);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin: 10px 0;
    }
    .sheet-prose table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin: 10px 0;
      display: block;
      overflow-x: auto;
      font-variant-numeric: tabular-nums;
    }
    .sheet-prose th, .sheet-prose td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
    }
    .sheet-prose th {
      background-color: var(--bg-2);
      color: var(--ink-1);
      font-weight: 600;
    }
  </style>

    function parsePriceRangeBar(priceStr, supStr, resStr) {
      const p = parseFloat(priceStr);
      const s = parseFloat(supStr);
      const r = parseFloat(resStr);
      if (isNaN(p) || isNaN(s) || isNaN(r) || r <= s) return null;
      const pct = Math.max(2, Math.min(98, Math.round(((p - s) / (r - s)) * 100)));
      return { pct, s, r, p };
    }

    function parseRadarText(msgText) {
      const defs = [
        { key: "核心热点态势", id: "ai", title: "科技与 AI 最新成果", source: "GitHub · HackerNews · HuggingFace · arXiv" },
        { key: "异动与弱信号", id: "games", title: "游戏圈与 App Store / Play Store 动态", source: "PocketGamer · TouchArcade · 游戏陀螺 · Steam" },
        { key: "舆论风向争议", id: "finance", title: "货币、宏观与金融期货", source: "金十数据 · 华尔街见闻 · 财联社 · 格隆汇" },
        { key: "RSS 深度洞察", id: "geo", title: "国际政治与外媒视野", source: "联合早报 · 参考消息 · 卫星通讯社" },
        { key: "研判策略建议", id: "social", title: "大众舆情热点与选题灵感", source: "微博 · 知乎 · B站 · 抖音 · 澎湃" }
      ];
      const out = [];
      defs.forEach(def => {
        const reg = new RegExp(`\\*\\*${def.key}\\*\\*([\\s\\S]*?)(?=\\n\\*\\*(?:核心热点态势|舆论风向争议|异动与弱信号|RSS 深度洞察|研判策略建议)\\*\\*|\\n> 更新时间|$)`);
        const m = msgText.match(reg);
        if (m && m[1].trim()) {
          let currentTag = "";
          const items = [];
          m[1].trim().split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
            const tagM = line.match(/^【([^】]+)】[：:]?(.*)$/);
            if (tagM) {
              currentTag = tagM[1].trim();
              if (tagM[2].trim()) items.push({ tag: currentTag, text: tagM[2].trim() });
            } else {
              const clean = line.replace(/^\d+\.\s*/, "");
              if (clean) items.push({ tag: currentTag, text: clean });
            }
          });
          if (items.length) out.push({ ...def, items });
        }
      });
      return out.length ? out : FALLBACK_RADAR;
    }

    async function loadAllData() {
      const syncEl = document.getElementById("sync-time");
      const iconEl = document.getElementById("refresh-icon");
      syncEl.textContent = "同步中...";
      if (iconEl) iconEl.classList.add("animate-spin");

      // Render fallback immediately so user never sees blank screen
      renderStocks();
      renderRadar();

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1`);
        const raw = await res.text();
        const messages = raw.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(x => x.event === "message");

        // 1. Reassemble Stock Dashboard
        const stockChunks = messages.filter(x =>
          (x.title || "").includes("股票分析报告") &&
          !(x.message || "").includes("# 📈 大盘复盘") &&
          !(x.message || "").includes("五、消息催化")
        );
        stockChunks.sort((a, b) => {
          const ma = (a.title || "").match(/\((\d+)\/(\d+)\)/);
          const mb = (b.title || "").match(/\((\d+)\/(\d+)\)/);
          if (ma && mb && ma[2] === mb[2]) return parseInt(ma[1]) - parseInt(mb[1]);
          return a.time - b.time;
        });
        const fullStockMd = stockChunks.map(x => x.message).join("\n");

        const scoreMap = {};
        const summaryRegex = /\*\*([^*]+?)\(([^)]+)\)\*\*:\s*([^|]+)\|\s*评分\s*(\d+)\s*\|\s*([^\n]+)/g;
        let sm;
        while ((sm = summaryRegex.exec(fullStockMd)) !== null) {
          scoreMap[sm[2].trim()] = {
            name: sm[1].trim(),
            code: sm[2].trim(),
            advice: sm[3].trim(),
            score: sm[4].trim(),
            trend: sm[5].trim()
          };
        }

        const sections = fullStockMd.split(/\n(?=##\s+[🟢🟡🔴⚪])/);
        const parsed = [];
        sections.forEach(sec => {
          const hm = sec.match(/^##\s+[🟢🟡🔴⚪]\s+(.+?)\s*\(([^)]+)\)/);
          if (!hm) return;
          const name = hm[1].trim();
          const code = hm[2].trim();
          const meta = scoreMap[code] || { name, code, advice: "观望", score: "50", trend: "震荡" };

          const oneM = sec.match(/\*\*一句话决策\*\*:\s*([^\n]+)/);
          const wkM = sec.match(/\*\*📅 未来 1 周推演\*\*：([^\n]+)/);
          const moM = sec.match(/\*\*📆 未来 1 个月中线预判\*\*：([^\n]+)/);
          const buyM = sec.match(/\|\s*🎯 理想买入点\s*\|\s*([^|]+)\|/);
          const stopM = sec.match(/\|\s*🛑 止损位\s*\|\s*([^|]+)\|/);
          const tpM = sec.match(/\|\s*🎊 目标位\s*\|\s*([^|]+)\|/);
          const priceM = sec.match(/\|\s*当前价\s*\|\s*([0-9.]+)\s*\|/);
          const chgM = sec.match(/\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*([+-]?[0-9.]+%)\s*\|/);
          const supM = sec.match(/\|\s*支撑位\s*\|\s*([0-9.]+)\s*\|/);
          const resM = sec.match(/\|\s*压力位\s*\|\s*([0-9.]+)\s*\|/);
          const biasM = sec.match(/\|\s*乖离率\(MA5\)\s*\|\s*([^|]+)\|/);
          const posM = sec.match(/\*\*💰 仓位建议\*\*:\s*(?:建议仓位[：:]?)?([^\n]+)/);
          const noPosM = sec.match(/\|\s*🆕 \*\*空仓者\*\*\s*\|\s*([^|]+)\|/);
          const hasPosM = sec.match(/\|\s*💼 \*\*持仓者\*\*\s*\|\s*([^|]+)\|/);

          parsed.push({
            ...meta,
            category: /^(sh000|sz399|csi)/i.test(code) ? "INDEX" : (/^(51|58|15)/.test(code) || name.includes("ETF") ? "ETF" : "STOCK"),
            oneSentence: oneM ? oneM[1].trim() : "",
            weekForecast: wkM ? wkM[1].trim().replace(/^未来1周（5个交易日）走势推演：/, "") : "",
            monthForecast: moM ? moM[1].trim().replace(/^未来1个月（20个交易日）中线趋势预判：/, "") : "",
            idealBuy: buyM ? buyM[1].trim() : "",
            stopLoss: stopM ? stopM[1].trim() : "",
            takeProfit: tpM ? tpM[1].trim() : "",
            price: priceM ? priceM[1].trim() : "",
            changePct: chgM ? chgM[1].trim() : "",
            support: supM ? supM[1].trim() : "",
            resistance: resM ? resM[1].trim() : "",
            bias: biasM ? biasM[1].trim() : "",
            suggestedPos: posM ? posM[1].trim() : "",
            noPosAdvice: noPosM ? noPosM[1].trim() : "",
            hasPosAdvice: hasPosM ? hasPosM[1].trim() : "",
            rawMarkdown: sec
          });
        });

        if (parsed.length) {
          parsed.sort((a, b) => parseInt(b.score || 0) - parseInt(a.score || 0));
          stocksData = parsed;
          const holdCnt = parsed.filter(s => parseInt(s.score || 0) >= 58 || s.advice.includes("持有")).length;
          document.getElementById("banner-counts").textContent = `${holdCnt}持有 · ${parsed.length - holdCnt}观望`;
          renderStocks();
        }

        // 2. Market Review
        const marketChunks = messages.filter(x => (x.message || "").includes("大盘复盘") || (x.message || "").includes("六、明日交易计划"));
        const fullMarketMd = marketChunks.map(x => x.message).join("\n");
        const sigM = fullMarketMd.match(/盘面信号\*\*：\s*(\d+)\/100（([^）]+)）/);
        if (sigM) {
          document.getElementById("banner-score").textContent = `${sigM[1]}°`;
          document.getElementById("banner-status").textContent = `${sigM[2]} · 建议总仓 <30%`;
        }
        document.getElementById("market-view").innerHTML = `
          <div class="outer-card p-4 sheet-prose">
            ${marked.parse(fullMarketMd || "暂无大盘复盘数据")}
          </div>
        `;

        // 3. TrendRadar 5-Domain AI Report
        const radarMsgs = messages.filter(x => (x.message || "").includes("AI 热点分析"));
        if (radarMsgs.length) {
          radarData = parseRadarText(radarMsgs[radarMsgs.length - 1].message);
          renderRadar();
        }

        const lastTs = messages.length ? new Date(messages[messages.length - 1].time * 1000).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : "--";
        syncEl.textContent = `已同步 ${lastTs}`;
      } catch (err) {
        syncEl.textContent = "本地快照模式";
      } finally {
        if (iconEl) iconEl.classList.remove("animate-spin");
      }
    }

    loadAllData();
  </script>
</body>
</html>
