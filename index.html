<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
          borderRadius: {
            lg: "0.625rem",
            md: "0.5rem",
            sm: "0.375rem",
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 45%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
    }
    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 5.5%;
      --card-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 13.5%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 13.5%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
    }
    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      -webkit-tap-highlight-color: transparent;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .shadcn-card {
      background-color: hsl(var(--card));
      color: hsl(var(--card-foreground));
      border: 1px solid hsl(var(--border));
      border-radius: 0.75rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Markdown inside Sheet & Cards */
    .md-prose h1, .md-prose h2 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid hsl(var(--border));
    }
    .md-prose h3, .md-prose h4 {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.85rem;
      margin-bottom: 0.35rem;
      color: hsl(var(--foreground));
    }
    .md-prose p, .md-prose li {
      font-size: 0.8125rem;
      line-height: 1.6;
      color: hsl(var(--muted-foreground));
    }
    .md-prose strong { color: hsl(var(--foreground)); font-weight: 600; }
    .md-prose ul { list-style: disc; padding-left: 1.15rem; margin: 0.4rem 0; }
    .md-prose blockquote {
      border-left: 2px solid hsl(var(--primary));
      padding: 0.5rem 0.75rem;
      background-color: hsl(var(--muted) / 0.5);
      border-radius: 0 0.375rem 0.375rem 0;
      margin: 0.6rem 0;
    }
    .md-prose blockquote p { color: hsl(var(--foreground)); font-weight: 500; }
    .md-prose table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin: 0.6rem 0;
      display: block;
      overflow-x: auto;
    }
    .md-prose th, .md-prose td {
      border: 1px solid hsl(var(--border));
      padding: 0.4rem 0.6rem;
      text-align: left;
      white-space: nowrap;
    }
    .md-prose th {
      background-color: hsl(var(--muted));
      color: hsl(var(--foreground));
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-zinc-500/20">

    function toggleTheme() {
      document.documentElement.classList.toggle("dark");
    }

    function classifyCode(code, name) {
      if (/^(sh000|sz399|csi)/i.test(code)) return "INDEX";
      if (/^(51|58|15)/.test(code) || (name || "").includes("ETF")) return "ETF";
      return "STOCK";
    }

    function categoryLabel(cat) {
      if (cat === "INDEX") return "宽基指数";
      if (cat === "ETF") return "跨资产ETF";
      return "龙头个股";
    }

    function scoreTone(score) {
      const s = parseInt(score || "50", 10);
      if (s >= 59) return {
        badge: "bg-emerald-500/10 text-emerald-500 border-emerald-500/25",
        bar: "bg-emerald-500",
        text: "text-emerald-500"
      };
      if (s >= 48) return {
        badge: "bg-amber-500/10 text-amber-500 border-amber-500/25",
        bar: "bg-amber-500",
        text: "text-amber-500"
      };
      return {
        badge: "bg-rose-500/10 text-rose-500 border-rose-500/25",
        bar: "bg-rose-500",
        text: "text-rose-500"
      };
    }

    function switchView(view) {
      activeView = view;
      ["stocks", "radar", "market"].forEach(v => {
        document.getElementById("view-" + v).classList.toggle("hidden", v !== view);
        const dbtn = document.getElementById("dtab-" + v);
        if (dbtn) {
          dbtn.className = v === view
            ? "px-3 py-1 rounded-md text-xs font-medium bg-background text-foreground shadow-xs transition"
            : "px-3 py-1 rounded-md text-xs font-medium text-muted-foreground hover:text-foreground transition";
        }
        const mbtn = document.getElementById("mtab-" + v);
        if (mbtn) {
          mbtn.className = v === view
            ? "flex flex-col items-center justify-center py-1.5 rounded-lg text-[11px] font-semibold bg-secondary text-foreground transition"
            : "flex flex-col items-center justify-center py-1.5 rounded-lg text-[11px] font-medium text-muted-foreground transition";
        }
      });
    }

    function setCategory(cat) {
      activeCategory = cat;
      focusedCode = "";
      document.querySelectorAll(".cat-btn").forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap bg-primary text-primary-foreground transition";
        } else {
          btn.className = "cat-btn px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap text-muted-foreground hover:text-foreground transition";
        }
      });
      renderStockGrid();
    }

    function toggleFocusCode(code) {
      focusedCode = (focusedCode === code) ? "" : code;
      renderStockGrid();
    }

    function openSheet(code) {
      const item = allStocks.find(s => s.code === code);
      if (!item) return;
      document.getElementById("sheet-title").textContent = `${item.name} (${item.code})`;
      document.getElementById("sheet-subtitle").textContent = `AI评分 ${item.score}/100 · 决策: ${item.advice} · 趋势: ${item.trend}`;
      document.getElementById("sheet-body").innerHTML = marked.parse(item.rawMarkdown || "");
      document.getElementById("detail-sheet").classList.remove("hidden");
    }

    function closeSheet() {
      document.getElementById("detail-sheet").classList.add("hidden");
    }

    function renderStockGrid() {
      const pillBar = document.getElementById("stock-pills");
      const grid = document.getElementById("stock-grid");
      const q = (document.getElementById("stock-search").value || "").trim().toLowerCase();

      // Quick jump pills
      pillBar.innerHTML = allStocks.map(s => {
        const isFocused = focusedCode === s.code;
        const t = scoreTone(s.score);
        return `
          <button onclick="toggleFocusCode('${s.code}')" class="px-2.5 py-1 rounded-full text-[11px] font-medium whitespace-nowrap border transition flex items-center gap-1.5 ${
            isFocused
              ? "bg-primary text-primary-foreground border-primary"
              : "bg-card text-foreground border-border hover:bg-accent"
          }">
            <span>${s.name}</span>
            <span class="font-mono text-[10px] ${isFocused ? 'opacity-90' : t.text}">${s.score}</span>
          </button>
        `;
      }).join("");

      const filtered = allStocks.filter(s => {
        if (focusedCode && s.code !== focusedCode) return false;
        if (activeCategory !== "ALL" && s.category !== activeCategory) return false;
        if (q && !s.name.toLowerCase().includes(q) && !s.code.toLowerCase().includes(q)) return false;
        return true;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="shadcn-card p-8 text-center text-xs text-muted-foreground md:col-span-2">未找到匹配的标的，请切换上方分类或清空搜索词。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const t = scoreTone(s.score);
        const chgNum = parseFloat(s.changePct || "0");
        const chgClass = chgNum > 0 ? "text-emerald-500" : (chgNum < 0 ? "text-rose-500" : "text-muted-foreground");
        const chgStr = s.changePct ? `${chgNum > 0 ? '+' : ''}${s.changePct}` : "";

        return `
          <article class="shadcn-card p-4 flex flex-col justify-between space-y-3.5 hover:border-zinc-700 transition">
            <div class="space-y-2.5">
              <!-- Card Top Header -->
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <h3 class="text-base font-semibold tracking-tight truncate">${s.name}</h3>
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-muted text-muted-foreground">${s.code}</span>
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-secondary text-secondary-foreground">${categoryLabel(s.category)}</span>
                  </div>
                  <div class="mt-1 flex items-baseline gap-2 font-mono">
                    <span class="text-lg font-bold">${s.price || '--'}</span>
                    ${chgStr ? `<span class="text-xs font-semibold ${chgClass}">${chgStr}</span>` : ''}
                    ${s.bias ? `<span class="text-[11px] text-muted-foreground">MA5乖离 ${s.bias}</span>` : ''}
                  </div>
                </div>

                <!-- Score Badge -->
                <div class="text-right shrink-0">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold border font-mono ${t.badge}">
                    ${s.score}分 · ${s.advice}
                  </span>
                  <div class="text-[11px] text-muted-foreground mt-1">趋势: <strong class="text-foreground">${s.trend}</strong> ${s.suggestedPos ? '· 仓位 ' + s.suggestedPos : ''}</div>
                </div>
              </div>

              <!-- Score Progress Bar -->
              <div class="h-1 w-full rounded-full bg-muted overflow-hidden">
                <div class="h-full ${t.bar}" style="width: ${Math.min(100, Math.max(10, parseInt(s.score||50)))}%"></div>
              </div>

              <!-- Core Conclusion Callout -->
              <div class="rounded-lg bg-muted/45 border border-border px-3 py-2 text-xs leading-relaxed">
                <span class="font-semibold text-foreground">核心决策：</span>
                <span class="text-muted-foreground">${s.oneSentence || '暂无摘要'}</span>
              </div>

              <!-- 1-Week & 1-Month Forecast Block -->
              ${(s.weekForecast || s.monthForecast) ? `
              <div class="rounded-lg border border-border bg-background/60 p-3 space-y-2 text-xs">
                <div class="flex items-center justify-between">
                  <span class="font-semibold text-foreground flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span>
                    未来 1 周 / 1 个月走势前瞻预判
                  </span>
                  <span class="text-[10px] font-mono text-muted-foreground">AI Forecast</span>
                </div>
                ${s.weekForecast ? `
                <div class="leading-relaxed">
                  <span class="inline-block px-1.5 py-0.2 rounded bg-sky-500/10 text-sky-400 font-medium text-[11px] mr-1">未来1周(5日)</span>
                  <span class="text-muted-foreground">${s.weekForecast}</span>
                </div>` : ''}
                ${s.monthForecast ? `
                <div class="leading-relaxed pt-1 border-t border-border/60">
                  <span class="inline-block px-1.5 py-0.2 rounded bg-indigo-500/10 text-indigo-400 font-medium text-[11px] mr-1">未来1月(20日)</span>
                  <span class="text-muted-foreground">${s.monthForecast}</span>
                </div>` : ''}
              </div>` : ''}

              <!-- Sniper Points Grid -->
              <div class="grid grid-cols-3 gap-2 text-[11px]">
                <div class="rounded-md border border-border bg-muted/30 p-2">
                  <div class="text-muted-foreground">🎯 理想买点</div>
                  <div class="font-mono font-semibold text-emerald-500 mt-0.5 truncate" title="${s.idealBuy}">${s.idealBuy || '--'}</div>
                </div>
                <div class="rounded-md border border-border bg-muted/30 p-2">
                  <div class="text-muted-foreground">🛑 严格止损</div>
                  <div class="font-mono font-semibold text-rose-500 mt-0.5 truncate" title="${s.stopLoss}">${s.stopLoss || '--'}</div>
                </div>
                <div class="rounded-md border border-border bg-muted/30 p-2">
                  <div class="text-muted-foreground">🎊 目标止盈</div>
                  <div class="font-mono font-semibold text-amber-500 mt-0.5 truncate" title="${s.takeProfit}">${s.takeProfit || '--'}</div>
                </div>
              </div>

              <!-- Position Advice Accordion -->
              ${(s.noPosAdvice || s.hasPosAdvice) ? `
              <div class="text-[11px] space-y-1 text-muted-foreground border-t border-border pt-2">
                ${s.noPosAdvice ? `<div class="truncate" title="${s.noPosAdvice}"><strong class="text-foreground">空仓指令：</strong>${s.noPosAdvice.replace(/^空仓者建议[：:]?/, '')}</div>` : ''}
                ${s.hasPosAdvice ? `<div class="truncate" title="${s.hasPosAdvice}"><strong class="text-foreground">持仓指令：</strong>${s.hasPosAdvice.replace(/^持仓者建议[：:]?/, '')}</div>` : ''}
              </div>` : ''}
            </div>

            <!-- Card Footer Button -->
            <div class="pt-2 border-t border-border flex items-center justify-between">
              <span class="text-[11px] font-mono text-muted-foreground">
                支撑 ${s.support || '--'} / 压力 ${s.resistance || '--'}
              </span>
              <button onclick="openSheet('${s.code}')" class="px-2.5 py-1 rounded-md border border-border bg-secondary hover:bg-accent text-foreground text-xs font-medium transition">
                完整数据与检查单 →
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderRadar() {
      const filterBar = document.getElementById("radar-filter-bar");
      const grid = document.getElementById("radar-grid");
      const list = radarDomains.length ? radarDomains : FALLBACK_RADAR;

      filterBar.innerHTML = [
        { id: "ALL", title: "全部五大领域" },
        ...list.map(d => ({ id: d.id, title: d.title }))
      ].map(tab => `
        <button onclick="activeRadarDomain='${tab.id}'; renderRadar();" class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap border transition ${
          activeRadarDomain === tab.id
            ? "bg-primary text-primary-foreground border-primary"
            : "bg-card text-muted-foreground border-border hover:text-foreground"
        }">${tab.title}</button>
      `).join("");

      const visible = activeRadarDomain === "ALL" ? list : list.filter(d => d.id === activeRadarDomain);
      grid.innerHTML = visible.map(dom => `
        <div class="shadcn-card p-4 space-y-3">
          <div class="flex items-start justify-between gap-2 border-b border-border pb-2.5">
            <div>
              <h3 class="text-sm font-semibold text-foreground">${dom.title}</h3>
              <p class="text-[11px] text-muted-foreground font-mono mt-0.5">${dom.subtitle}</p>
            </div>
            <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-muted text-muted-foreground shrink-0">${dom.badge}</span>
          </div>
          <ul class="space-y-2">
            ${dom.items.map((item, i) => `
              <li class="flex items-start gap-2 text-xs leading-relaxed text-muted-foreground">
                <span class="w-4 h-4 rounded bg-secondary text-foreground font-mono text-[10px] flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>
                <span>${item}</span>
              </li>
            `).join("")}
          </ul>
        </div>
      `).join("");
    }

    function parseRadarMessage(msgText) {
      const mapDefs = [
        { key: "核心热点态势", id: "ai", badge: "AI & Tech", title: "科技与 AI 最新成果", subtitle: "GitHub · HackerNews · HuggingFace · arXiv" },
        { key: "异动与弱信号", id: "games", badge: "AppStore & PlayStore", title: "游戏圈与 App Store / Play Store 动态", subtitle: "PocketGamer · TouchArcade · 游戏陀螺 · Steam" },
        { key: "舆论风向争议", id: "finance", badge: "Macro & Futures", title: "货币、宏观与金融期货", subtitle: "金十数据 · 华尔街见闻 · 财联社 · 格隆汇" },
        { key: "RSS 深度洞察", id: "geo", badge: "Geopolitics", title: "国际政治与外媒视野", subtitle: "联合早报 · 参考消息 · 卫星通讯社" },
        { key: "研判策略建议", id: "social", badge: "Trends & Ideas", title: "大众舆情热点与选题灵感", subtitle: "微博 · 知乎 · B站 · 抖音 · 澎湃" }
      ];
      const out = [];
      mapDefs.forEach(def => {
        const reg = new RegExp(`\\*\\*${def.key}\\*\\*([\\s\\S]*?)(?=\\n\\*\\*(?:核心热点态势|舆论风向争议|异动与弱信号|RSS 深度洞察|研判策略建议)\\*\\*|\\n> 更新时间|$)`);
        const m = msgText.match(reg);
        if (m && m[1].trim()) {
          const lines = m[1].trim().split("\n").map(l => l.trim()).filter(Boolean);
          const items = [];
          lines.forEach(l => {
            const clean = l.replace(/^\d+\.\s*/, "");
            if (clean) items.push(clean);
          });
          if (items.length) out.push({ ...def, items });
        }
      });
      return out.length ? out : FALLBACK_RADAR;
    }

    async function loadNtfyData() {
      const statusEl = document.getElementById("sync-status");
      const iconEl = document.getElementById("refresh-icon");
      statusEl.textContent = "正在同步 ntfy.sh/" + TOPIC + " ...";
      if (iconEl) iconEl.classList.add("animate-spin");

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1`);
        const raw = await res.text();
        const messages = raw.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(x => x.event === "message");

        // 1. Reassemble Stock Dashboard chunks
        const stockChunks = messages.filter(x =>
          (x.title || "").includes("股票分析报告") &&
          !(x.message || "").includes("# 📈 大盘复盘") &&
          !(x.message || "").includes("五、消息催化")
        );
        stockChunks.sort((a, b) => {
          const ma = (a.title || "").match(/\((\d+)\/(\d+)\)/);
          const mb = (b.title || "").match(/\((\d+)\/(\d+)\)/);
          if (ma && mb && ma[2] === mb[2]) return parseInt(ma[1]) - parseInt(mb[1]);
          return a.time - b.time;
        });
        const fullStockMd = stockChunks.map(x => x.message).join("\n");

        const scoreMap = {};
        const summaryRegex = /\*\*([^*]+?)\(([^)]+)\)\*\*:\s*([^|]+)\|\s*评分\s*(\d+)\s*\|\s*([^\n]+)/g;
        let sm;
        while ((sm = summaryRegex.exec(fullStockMd)) !== null) {
          scoreMap[sm[2].trim()] = {
            name: sm[1].trim(),
            code: sm[2].trim(),
            advice: sm[3].trim(),
            score: sm[4].trim(),
            trend: sm[5].trim()
          };
        }

        const sections = fullStockMd.split(/\n(?=##\s+[🟢🟡🔴⚪])/);
        allStocks = [];
        sections.forEach(sec => {
          const hm = sec.match(/^##\s+[🟢🟡🔴⚪]\s+(.+?)\s*\(([^)]+)\)/);
          if (!hm) return;
          const name = hm[1].trim();
          const code = hm[2].trim();
          const meta = scoreMap[code] || { name, code, advice: "观望", score: "50", trend: "震荡" };

          const oneM = sec.match(/\*\*一句话决策\*\*:\s*([^\n]+)/);
          const wkM = sec.match(/\*\*📅 未来 1 周推演\*\*：([^\n]+)/);
          const moM = sec.match(/\*\*📆 未来 1 个月中线预判\*\*：([^\n]+)/);
          const buyM = sec.match(/\|\s*🎯 理想买入点\s*\|\s*([^|]+)\|/);
          const stopM = sec.match(/\|\s*🛑 止损位\s*\|\s*([^|]+)\|/);
          const tpM = sec.match(/\|\s*🎊 目标位\s*\|\s*([^|]+)\|/);
          const priceM = sec.match(/\|\s*当前价\s*\|\s*([0-9.]+)\s*\|/);
          const chgM = sec.match(/\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*[0-9.]+\s*\|\s*([+-]?[0-9.]+%)\s*\|/);
          const supM = sec.match(/\|\s*支撑位\s*\|\s*([0-9.]+)\s*\|/);
          const resM = sec.match(/\|\s*压力位\s*\|\s*([0-9.]+)\s*\|/);
          const biasM = sec.match(/\|\s*乖离率\(MA5\)\s*\|\s*([^|]+)\|/);
          const posM = sec.match(/\*\*💰 仓位建议\*\*:\s*(?:建议仓位[：:]?)?([^\n]+)/);
          const noPosM = sec.match(/\|\s*🆕 \*\*空仓者\*\*\s*\|\s*([^|]+)\|/);
          const hasPosM = sec.match(/\|\s*💼 \*\*持仓者\*\*\s*\|\s*([^|]+)\|/);

          allStocks.push({
            ...meta,
            category: classifyCode(code, name),
            oneSentence: oneM ? oneM[1].trim() : "",
            weekForecast: wkM ? wkM[1].trim().replace(/^未来1周（5个交易日）走势推演：/, "") : "",
            monthForecast: moM ? moM[1].trim().replace(/^未来1个月（20个交易日）中线趋势预判：/, "") : "",
            idealBuy: buyM ? buyM[1].trim() : "",
            stopLoss: stopM ? stopM[1].trim() : "",
            takeProfit: tpM ? tpM[1].trim() : "",
            price: priceM ? priceM[1].trim() : "",
            changePct: chgM ? chgM[1].trim() : "",
            support: supM ? supM[1].trim() : "",
            resistance: resM ? resM[1].trim() : "",
            bias: biasM ? biasM[1].trim() : "",
            suggestedPos: posM ? posM[1].trim() : "",
            noPosAdvice: noPosM ? noPosM[1].trim() : "",
            hasPosAdvice: hasPosM ? hasPosM[1].trim() : "",
            rawMarkdown: sec
          });
        });

        // Sort by score descending
        allStocks.sort((a, b) => parseInt(b.score || 0) - parseInt(a.score || 0));

        // Update top metrics
        const holdCount = allStocks.filter(s => s.advice.includes("持有") || s.advice.includes("买")).length;
        const watchCount = allStocks.length - holdCount;
        document.getElementById("metric-stock-count").textContent = `${allStocks.length} 只`;
        document.getElementById("metric-stock-split").textContent = `${holdCount} 持有 / ${watchCount} 观望`;
        if (allStocks.length >= 2) {
          document.getElementById("metric-top-bull").textContent = `${allStocks[0].name}(${allStocks[0].score})`;
          const last = allStocks[allStocks.length - 1];
          document.getElementById("metric-top-bear").textContent = `${last.name}(${last.score})`;
        }

        renderStockGrid();

        // 2. Market Review
        const marketChunks = messages.filter(x => (x.message || "").includes("大盘复盘") || (x.message || "").includes("六、明日交易计划"));
        const fullMarketMd = marketChunks.map(x => x.message).join("\n");
        const sigM = fullMarketMd.match(/盘面信号\*\*：\s*(\d+)\/100（([^）]+)）/);
        if (sigM) {
          document.getElementById("metric-market-score").textContent = `${sigM[1]} / 100`;
          document.getElementById("metric-market-tag").textContent = sigM[2];
          document.getElementById("metric-market-bar").style.width = `${sigM[1]}%`;
        } else {
          document.getElementById("metric-market-score").textContent = "43 / 100";
          document.getElementById("metric-market-tag").textContent = "震荡防守";
        }
        document.getElementById("market-container").innerHTML = `
          <div class="shadcn-card p-4 sm:p-5 md-prose">
            ${marked.parse(fullMarketMd || "暂无大盘复盘数据")}
          </div>
        `;

        // 3. TrendRadar 5-Domain AI Report
        const radarMsgs = messages.filter(x => (x.message || "").includes("AI 热点分析"));
        if (radarMsgs.length) {
          const latest = radarMsgs[radarMsgs.length - 1];
          radarDomains = parseRadarMessage(latest.message);
          document.getElementById("radar-timestamp").textContent = new Date(latest.time * 1000).toLocaleString("zh-CN");
        } else {
          radarDomains = FALLBACK_RADAR;
        }
        renderRadar();

        const lastTs = messages.length ? new Date(messages[messages.length - 1].time * 1000).toLocaleString("zh-CN") : "--";
        statusEl.textContent = `ntfy.sh/${TOPIC} · 最新同步 ${lastTs}`;
      } catch (e) {
        statusEl.textContent = "离线缓存模式 · " + e.message;
        radarDomains = FALLBACK_RADAR;
        renderRadar();
      } finally {
        if (iconEl) iconEl.classList.remove("animate-spin");
      }
    }

    lucide.createIcons();
    switchView("stocks");
    loadNtfyData();
  </script>
</body>
