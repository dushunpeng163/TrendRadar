# ═══════════════════════════════════════════════════════════════
# TrendRadar 配置文件（全领域定制版：金融宏观 + AI科技 + 移动游戏/AppStore/PlayStore + 国际政治 + 大众热点）
# Version: 2.4.0
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: false
  preset: "morning_evening"

# ===============================================================
# 2. 数据源 - 热榜平台（已配齐五大领域）
# ===============================================================
platforms:
  enabled: true
  api_url: ""
  sources:
    # --- 货币、宏观与金融 ---
    - id: "jin10"
      name: "金十数据"
    - id: "wallstreetcn-quick"
      name: "华尔街见闻快讯"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻最热"
    - id: "cls-telegraph"
      name: "财联社电报"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "gelonghui"
      name: "格隆汇"
    - id: "xueqiu"
      name: "雪球"

    # --- 科技 / AI / 程序员 / 游戏圈 ---
    - id: "github"
      name: "GitHub今日飙升"
    - id: "hackernews"
      name: "HackerNews"
    - id: "producthunt"
      name: "ProductHunt"
    - id: "v2ex"
      name: "V2EX"
    - id: "juejin"
      name: "掘金"
    - id: "sspai"
      name: "少数派"
    - id: "ithome"
      name: "IT之家"
    - id: "36kr"
      name: "36氪"
    - id: "coolapk"
      name: "酷安"
    - id: "steam"
      name: "Steam游戏榜"

    # --- 国际政治 / 外媒视野 ---
    - id: "zaobao"
      name: "联合早报"
    - id: "cankaoxiaoxi"
      name: "参考消息"
    - id: "sputniknewscn"
      name: "俄罗斯卫星通讯社"

    # --- 大众舆情 / 找选题 / 社会热点 ---
    - id: "weibo"
      name: "微博热搜"
    - id: "zhihu"
      name: "知乎热榜"
    - id: "bilibili-hot-search"
      name: "B站热搜"
    - id: "douyin"
      name: "抖音热点"
    - id: "toutiao"
      name: "今日头条"
    - id: "thepaper"
      name: "澎湃新闻"

# ===============================================================
# 3. 数据源 - RSS 订阅（专补 AI 最新成果 + App Store / Play Store 手游）
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 2

  feeds:
    # --- AI 最新研究成果与开源动态 ---
    - id: "huggingface-blog"
      name: "HuggingFace最新成果"
      url: "https://huggingface.co/blog/feed.xml"
    - id: "arxiv-ai"
      name: "arXiv-AI最新论文"
      url: "http://rss.arxiv.org/rss/cs.AI"

    # --- Play Store / App Store 与全球手游市场 ---
    - id: "pocketgamer"
      name: "PocketGamer全球手游市场(AppStore/GooglePlay)"
      url: "https://www.pocketgamer.biz/rss/"
    - id: "toucharcade"
      name: "TouchArcade(iOS手游新游与评测)"
      url: "https://toucharcade.com/feed/"
    - id: "youxituoluo"
      name: "游戏陀螺(国内手游与出海榜单)"
      url: "https://www.youxituoluo.com/feed"
    - id: "gcores"
      name: "机核网(游戏与独立开发)"
      url: "https://www.gcores.com/rss"
    - id: "gamedeveloper"
      name: "GameDeveloper(全球游戏研发)"
      url: "https://www.gamedeveloper.com/rss.xml"
    - id: "apple-top-free"
      name: "AppStore美区免费榜Top25"
      url: "https://rss.marketingtools.apple.com/api/v2/us/apps/top-free/25/apps.rss"

    # --- 海外宏观财经 ---
    - id: "yahoo-finance"
      name: "雅虎财经"
      url: "https://finance.yahoo.com/news/rssindex"

# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 3

# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "keyword"
  priority_sort_enabled: true

ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.65
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 5. 推送内容控制（默认只推送干净的 AI 全领域分类报告，不刷屏链接）
# ===============================================================
display:
  region_order:
    - ai_analysis
    - new_items
    - hotlist
    - rss
    - standalone

  regions:
    hotlist: false
    new_items: false
    rss: false
    standalone: false
    ai_analysis: true

  standalone:
    platforms: ["github", "producthunt", "steam", "jin10", "zaobao"]
    rss_feeds: ["pocketgamer", "youxituoluo", "huggingface-blog", "apple-top-free"]
    max_items: 15

# ===============================================================
# 6. 推送通知
# ===============================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

# ===============================================================
# 8. AI 模型配置
# ===============================================================
ai:
  model: "gemini/gemini-3.5-flash-lite"
  api_key: ""
  api_base: ""
  timeout: 120
  temperature: 0.7
  max_tokens: 5000
  num_retries: 2
  fallback_models: ["gemini/gemini-3.6-flash"]

# ===============================================================
# 9. AI 分析功能（纳入热榜 + RSS + 独立展示区全量数据给 AI 写报告）
# ===============================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 200
  include_rss: true
  include_standalone: true
  include_rank_timeline: false

# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: false
    standalone: false

# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 1500
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 800
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
